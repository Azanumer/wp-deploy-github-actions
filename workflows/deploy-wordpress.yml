# Deploy WordPress to a VPS over SSH on every push to main.
#
# Copy this file to .github/workflows/deploy-wordpress.yml in your
# WordPress project, then add the repository secrets listed below.
#
# Required repository secrets:
#   SSH_HOST     - server hostname or IP
#   SSH_USER     - SSH user (must have write access to DEPLOY_PATH)
#   SSH_KEY      - private key (no passphrase), added to the user's authorized_keys
#   SSH_PORT     - SSH port (default 22)
#   DEPLOY_PATH  - absolute path of the WordPress install on the server
#   WP_CLI       - (optional) path to the wp binary, default "wp"
#
# Flow: git fetch + reset --hard to origin/main, clean untracked files
# (uploads and .env are kept), then wp cache flush + rewrite flush when
# WP-CLI is available.

name: Deploy WordPress

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          WP_CLI: ${{ secrets.WP_CLI }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,WP_CLI
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard origin/main
            git clean -fd --exclude=wp-content/uploads --exclude=.env
            if command -v "${WP_CLI:-wp}" >/dev/null 2>&1; then
              "${WP_CLI:-wp}" cache flush --allow-root || true
              "${WP_CLI:-wp}" rewrite flush --allow-root || true
            fi
            echo "Deployed $(git rev-parse --short HEAD) at $(date -u +%FT%TZ)"
